<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preload" href="/new_initialload_bg.png" as="image" fetchpriority="high" />
    <link rel="preload" href="/cards_bg.png" as="image" />
    <title>Cozy Casino</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Audiowide&family=Boogaloo&family=Bubblegum+Sans&family=Cinzel+Decorative:wght@700;900&family=Exo+2:wght@700;900&family=Fredoka:wght@600;700&family=Germania+One&family=Luckiest+Guy&family=Noto+Serif+JP:wght@700;900&family=Nunito:wght@800;900&family=Orbitron:wght@700;900&family=Pirata+One&family=Rye&family=Titan+One&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=tanker@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
  <body>
    <!-- Portrait-mode rotate prompt -->
    <div id="rotate-overlay">
      <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="rgba(168,85,247,0.9)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="2" width="16" height="20" rx="2" ry="2"/>
        <path d="M9 22h6"/>
        <animateTransform attributeName="transform" type="rotate" from="0 12 12" to="-90 12 12" dur="1.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1" additive="sum"/>
      </svg>
      <div style="font-family:'Titan One',cursive;font-size:30px;color:#fff;letter-spacing:1px;">Rotate Device</div>
      <div style="font-size:15px;color:rgba(255,255,255,0.55);max-width:260px;line-height:1.6;">
        Cozy Casino is designed for landscape mode.<br>Please rotate your phone horizontally to play.
      </div>
      <div style="margin-top:8px;background:rgba(255,255,255,0.06);border-radius:16px;padding:16px 20px;max-width:280px;">
        <div style="font-size:11px;font-weight:900;color:#a855f7;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;">Install as App</div>
        <div style="font-size:12px;color:rgba(255,255,255,0.5);line-height:1.7;text-align:left;">
          <b style="color:rgba(255,255,255,0.8);">iPhone/iPad:</b> Tap the Share icon → "Add to Home Screen"<br>
          <b style="color:rgba(255,255,255,0.8);">Android:</b> Tap ⋮ menu → "Add to Home Screen" or "Install app"
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
