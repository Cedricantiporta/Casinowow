<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  @font-face { font-family: "Titan One"; src: url("TitanOne.woff2") format("woff2"); }
  @font-face { font-family: "Fredoka"; src: url("Fredoka.woff2") format("woff2"); font-weight: 300 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0e0222; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Fredoka", sans-serif; color: #fff;
    background: radial-gradient(1100px 1400px at 50% 48%, #4a1190 0%, #2a0860 40%, #10022a 100%); }
  #rays { position: absolute; left: 50%; top: 52%; width: 3000px; height: 3000px; margin: -1500px 0 0 -1500px; border-radius: 50%;
    background: repeating-conic-gradient(from 8deg, rgba(197,16,224,0.11) 0deg 7deg, rgba(197,16,224,0) 7deg 18deg);
    -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 60%); mask-image: radial-gradient(circle, #000 0%, transparent 60%); }
  .bokeh { position: absolute; border-radius: 50%; filter: blur(2px); }
  .spark { position: absolute; filter: drop-shadow(0 0 6px #ffe9a8); }
  .spark::before, .spark::after { content: ""; position: absolute; left: 50%; top: 50%; background: #fff; border-radius: 4px; transform: translate(-50%, -50%); }
  .spark::before { width: 3px; height: 100%; } .spark::after { width: 100%; height: 3px; }

  #head { position: absolute; left: 60px; right: 60px; top: 110px; text-align: center; text-wrap: balance; }
  #headline { font-family: "Titan One", sans-serif; font-size: 112px; line-height: 1.08;
    background: linear-gradient(180deg, #fff3b0 0%, #ffd34d 42%, #ff9d1a 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 0 #6b2a00) drop-shadow(0 14px 28px rgba(0,0,0,0.55)); }
  #sub { margin-top: 26px; font-weight: 600; font-size: 48px; line-height: 1.3; color: rgba(255,255,255,0.92); }

  #phone { position: absolute; left: 50%; width: 1000px; height: 498px; margin-left: -500px; border-radius: 52px; padding: 20px;
    background: linear-gradient(160deg, #3a3646 0%, #15131c 30%, #0b0a10 70%, #2a2633 100%);
    box-shadow: 0 40px 100px rgba(0,0,0,0.6), 0 0 0 2px rgba(255,255,255,0.06) inset, 0 0 90px rgba(197,16,224,0.35); transform: rotate(-3deg); }
  #screen { position: absolute; inset: 20px; border-radius: 34px; overflow: hidden; background: #000 center / cover no-repeat; }
  #glare { position: absolute; inset: 20px; border-radius: 34px; background: linear-gradient(115deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 32%); }

  #zoom { position: absolute; left: 50%; width: 960px; margin-left: -480px; border-radius: 48px; overflow: hidden; background: #000 no-repeat;
    box-shadow: 0 0 90px rgba(255,190,60,0.5), 0 40px 90px rgba(0,0,0,0.6); transform: rotate(2deg); }
  #sticker { position: absolute; padding: 18px 40px; border-radius: 999px; font-family: "Titan One", sans-serif; font-size: 56px; color: #3a1500; white-space: nowrap;
    background: linear-gradient(180deg, #fff3b0, #ffd34d 45%, #ff9d1a); box-shadow: 0 10px 0 #8a3b00, 0 22px 44px rgba(0,0,0,0.5); transform: rotate(-6deg); }
  #sticker img { width: 64px; height: 64px; vertical-align: -14px; margin-right: 12px; }
</style>
</head>
<body>
<div id="root">
  <div id="rays"></div>
  <div id="fx"></div>
  <div id="head"><div id="headline"></div><div id="sub"></div></div>
  <div id="phone"><div id="screen"></div><div id="glare"></div></div>
  <div id="zoom"></div>
  <div id="sticker"></div>
</div>
<script>
  // cfg: { src, headline, sub, crop:[x,y,w,h] in 932x430 game px, sticker, coin, phoneTop, layout }
  window.build = (cfg) => {
    let seed = cfg.seed || 7;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    const fx = document.getElementById('fx');
    for (let i = 0; i < 46; i++) {
      const el = document.createElement('div');
      if (rnd() < 0.5) { el.className = 'spark'; const s = 10 + rnd() * 20; el.style.width = el.style.height = s + 'px'; el.style.opacity = 0.4 + rnd() * 0.6; }
      else { el.className = 'bokeh'; const s = 16 + rnd() * 80; el.style.width = el.style.height = s + 'px'; const h = rnd() < 0.5 ? '255,211,77' : '197,16,224';
        el.style.background = `radial-gradient(circle, rgba(${h},0.5), rgba(${h},0))`; }
      el.style.left = rnd() * 1080 + 'px'; el.style.top = rnd() * 1920 + 'px'; fx.appendChild(el);
    }
    const hl = document.getElementById('headline');
    hl.textContent = cfg.headline;
    document.getElementById('sub').textContent = cfg.sub;
    // shrink a short headline until it sits on one line; long ones wrap balanced
    let fs = 112; hl.style.fontSize = fs + 'px';
    if (cfg.headline.length <= 20) { while (hl.getBoundingClientRect().height > fs * 1.3 && fs > 96) { fs -= 2; hl.style.fontSize = fs + 'px'; }
      if (hl.getBoundingClientRect().height > fs * 1.3) { fs = 112; hl.style.fontSize = fs + 'px'; } }
    const headBottom = document.getElementById('head').getBoundingClientRect().bottom;
    const [cx, cy, cw, ch] = cfg.crop;
    const PH = 498, GAP = 70, BOTTOM = 1840;
    let zw = 960, zh = Math.round(zw * ch / cw);
    const avail = BOTTOM - (headBottom + 50) - PH - GAP;
    if (zh > avail) { zh = Math.floor(avail); zw = Math.round(zh * cw / ch); }
    const used = PH + GAP + zh;
    const phoneTop = Math.round(headBottom + 50 + Math.max(0, (BOTTOM - (headBottom + 50) - used) / 2));
    const phone = document.getElementById('phone'); phone.style.top = phoneTop + 'px';
    document.getElementById('screen').style.backgroundImage = `url("${cfg.src}")`;
    const zoom = document.getElementById('zoom');
    const zTop = phoneTop + PH + GAP;
    Object.assign(zoom.style, { top: zTop + 'px', width: zw + 'px', marginLeft: -zw / 2 + 'px', height: zh + 'px', backgroundImage: `url("${cfg.src}")`,
      backgroundSize: `${932 * zw / cw}px ${430 * zw / cw}px`, backgroundPosition: `${-cx * zw / cw}px ${-cy * zw / cw}px` });
    const st = document.getElementById('sticker');
    if (cfg.sticker) {
      st.innerHTML = (cfg.coin ? '<img src="starcoin.png" alt="" />' : '') + cfg.sticker;
      st.style.top = (zTop + zh - 60) + 'px';
      st.style.right = Math.max(40, (1080 - zw) / 2 - 20) + 'px';
    } else st.remove();
    return zTop + zh;
  };
</script>
</body>
</html>
