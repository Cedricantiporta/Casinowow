<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  @font-face { font-family: "Titan One"; src: url("TitanOne.woff2") format("woff2"); }
  @font-face { font-family: "Fredoka"; src: url("Fredoka.woff2") format("woff2"); font-weight: 300 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; background: #12032b; }
  #root { position: relative; width: 1024px; height: 500px; overflow: hidden; font-family: "Fredoka", sans-serif; color: #fff; }
  #bg { position: absolute; inset: -40px; background: url("keyart.png") center / cover no-repeat; filter: blur(22px) brightness(0.45) saturate(1.3); }
  #tint { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(18,3,43,0.92) 0%, rgba(40,8,90,0.55) 50%, rgba(18,3,43,0.35) 100%); }
  #rays { position: absolute; left: 250px; top: 220px; width: 1600px; height: 1600px; margin: -800px 0 0 -800px; border-radius: 50%;
    background: repeating-conic-gradient(from 4deg, rgba(255,211,77,0.12) 0deg 6deg, rgba(255,211,77,0) 6deg 15deg);
    -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 55%); mask-image: radial-gradient(circle, #000 0%, transparent 55%); }
  #glow { position: absolute; left: 250px; top: 190px; width: 620px; height: 440px; margin: -220px 0 0 -310px; background: radial-gradient(closest-side, rgba(255,190,80,0.4), rgba(197,16,224,0.15) 60%, rgba(0,0,0,0)); }
  .bokeh { position: absolute; border-radius: 50%; filter: blur(1.5px); }
  .spark { position: absolute; filter: drop-shadow(0 0 4px #ffe9a8); }
  .spark::before, .spark::after { content: ""; position: absolute; left: 50%; top: 50%; background: #fff; border-radius: 3px; transform: translate(-50%, -50%); }
  .spark::before { width: 2px; height: 100%; } .spark::after { width: 100%; height: 2px; }

  #logo { position: absolute; left: 50px; top: 22px; width: 400px; height: 294px; filter: drop-shadow(0 14px 24px rgba(0,0,0,0.5)); }
  #gift { position: absolute; left: 38px; top: 336px; width: 424px; height: 70px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 12px;
    background: linear-gradient(180deg, rgba(40,6,80,0.92), rgba(14,2,34,0.95)); box-shadow: inset 0 2px 0 rgba(255,220,120,0.35), 0 10px 26px rgba(0,0,0,0.5); }
  #gift img { width: 46px; height: 46px; }
  #gift span { font-family: "Titan One", sans-serif; font-size: 30px; white-space: nowrap;
    background: linear-gradient(180deg, #fff3b0 0%, #ffd34d 42%, #ff9d1a 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #6b2a00); }
  #tag { position: absolute; left: 38px; width: 424px; top: 422px; text-align: center; font-weight: 600; font-size: 22px; color: rgba(255,255,255,0.88); }

  .phone { position: absolute; border-radius: 30px; padding: 11px;
    background: linear-gradient(160deg, #3a3646 0%, #15131c 30%, #0b0a10 70%, #2a2633 100%);
    box-shadow: 0 24px 50px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06) inset, 0 0 50px rgba(197,16,224,0.35); }
  .screen { position: absolute; inset: 11px; border-radius: 20px; overflow: hidden; background: #000 center / cover no-repeat; }
  .glare { position: absolute; inset: 11px; border-radius: 20px; background: linear-gradient(115deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 34%); }
  #p-back { left: 600px; top: 40px; width: 420px; height: 205px; transform: rotate(7deg); opacity: 0.95; }
  #p-front { left: 548px; top: 200px; width: 500px; height: 242px; transform: rotate(-5deg); }
  .coin { position: absolute; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.45)); }
</style>
</head>
<body>
<div id="root">
  <div id="bg"></div><div id="tint"></div><div id="rays"></div><div id="glow"></div>
  <div id="fx"></div>
  <div class="phone" id="p-back"><div class="screen" style="background-image:url('piggy_2_3400.png')"></div><div class="glare"></div></div>
  <div class="phone" id="p-front"><div class="screen" style="background-image:url('lobby.png')"></div><div class="glare"></div></div>
  <img class="coin" src="starcoin.png" alt="" style="left:520px; top:150px; width:54px; transform: rotate(-18deg);" />
  <img class="coin" src="starcoin.png" alt="" style="left:960px; top:420px; width:46px; transform: rotate(24deg);" />
  <img class="coin" src="starcoin.png" alt="" style="left:975px; top:22px; width:34px; transform: rotate(10deg);" />
  <img id="logo" src="logo.png" alt="Cozy Casino" />
  <div id="gift"><img src="starcoin.png" alt="" /><span>10,000,000 free coins</span></div>
  <div id="tag">Free social slots for Android</div>
</div>
<script>
  let seed = 41; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const fx = document.getElementById('fx');
  for (let i = 0; i < 34; i++) {
    const el = document.createElement('div');
    if (rnd() < 0.5) { el.className = 'spark'; const s = 7 + rnd() * 12; el.style.width = el.style.height = s + 'px'; el.style.opacity = 0.4 + rnd() * 0.6; }
    else { el.className = 'bokeh'; const s = 10 + rnd() * 40; el.style.width = el.style.height = s + 'px'; const h = rnd() < 0.5 ? '255,211,77' : '197,16,224';
      el.style.background = `radial-gradient(circle, rgba(${h},0.5), rgba(${h},0))`; }
    el.style.left = rnd() * 1024 + 'px'; el.style.top = rnd() * 500 + 'px'; fx.appendChild(el);
  }
</script>
</body>
</html>
